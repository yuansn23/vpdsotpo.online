
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新公式LINE追加者限定厳選銘柄</title>
   <meta name="DESCRIPTION" content="【新公式LINE追加者限定厳選銘柄】🔥
トラネコ@配当金で生活することが目標です！">
<meta id="ogImage" property="og:image" content="https://baycar.cc/22/img/1.jpg"><style>
        :root {
            --main-color: #2b546a;       /* 落ち着いた紺色 */
            --text-color: #333;          /* メインテキスト色 */
            --light-gray: #f5f5f5;       /* 背景グレー */
            --border-color: #e0e0e0;     /* ボーダー色 */
        }

        body {
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #fff;
            margin: 0 auto;
            max-width: 640px;
            padding: 12px;
            -webkit-text-size-adjust: 100%;
        }

        /* 画像左・テキスト右のレイアウト */
        .media-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .media-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .media-content {
            flex: 1;
        }

        .media-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--main-color);
            margin: 0 0 6px 0;
        }

        .media-text {
            font-size: 14px;
            margin: 0;
            color: #555;
            letter-spacing: 0.02em;
        }

        .media-meta {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }

        /* スマホでタップしやすいように */
        .media-item {
            transition: transform 0.2s;
        }

        .media-item:active {
            transform: scale(0.98);
            background: var(--light-gray);
        }
    </style>
</head>
<body>
    <!-- 例1 -->
    <div class="media-item">
        <img src="img/1.jpg" alt="桜の写真" class="media-image">
        <div class="media-content">
            <h3 class="media-title">【新公式LINE追加者限定厳選銘柄】🔥</h3>
            <p class="media-text">トラネコ@配当金で生活することが目標です！</p>
            
        </div>
    </div>


 
</body>
</html>
