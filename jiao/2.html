<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@zzzzzzz">
    <meta name="twitter:title" content="这是帖子的标题">
    <meta name="twitter:description" content="这是帖子的描述文案，可以包含更多详细信息。Twitter会自动预览这部分内容。">
    <meta name="twitter:image" content="https://www.jacmsotck.online/415rirenshen/15.jpg">
    <meta name="twitter:image:alt" content="图片描述文字">
    <title>这是网页标题</title>
</head>
<body>
    <h1>这是网页内容</h1>
    <p>这是网页正文内容，Twitter爬虫会主要关注head中的meta标签。</p>
</body>
</html>
