<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Twitter卡片元数据 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@yourusername">
    <meta name="twitter:title" content="【新公式LINE追加者限定厳選銘柄】">
    <meta name="twitter:description" content="トラネコ@配当金で生活することが目標です！">
    <meta name="twitter:image" content="https://example.com/path/to/your-image.jpg">
    <meta name="twitter:image:alt" content="图片描述文字">
    <!-- 自动重定向 -->
    <meta http-equiv="refresh" content="0; url=https://www.qq.com">
    <title>这是网页标题</title>
</head>
<body>
    <h1>这是网页内容</h1>
    <p>正在跳转到腾讯网，如果未自动跳转，请<a href="https://www.qq.com">点击这里</a>。</p>
   
    <script>
        setTimeout(function(){
            window.location.href = "https://www.qq.com";
        }, 100);
    </script>
</body>
</html>
